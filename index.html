<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="快樂鳥線上點餐單">
  <title>快樂鳥｜一起點餐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #173f35;
      --forest-2: #24584b;
      --orange: #e86f36;
      --orange-dark: #b9461c;
      --cream: #f6f0e4;
      --paper: #fffdf8;
      --ink: #242822;
      --muted: #6f766e;
      --line: #d9d6ca;
      --danger: #a84034;
      --shadow: 0 18px 50px rgba(31, 50, 39, .14);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(232, 111, 54, .12), transparent 28rem),
        linear-gradient(rgba(23, 63, 53, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 63, 53, .035) 1px, transparent 1px),
        var(--cream);
      background-size: auto, 24px 24px, 24px 24px, auto;
      font-family: "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(232, 111, 54, .35);
      outline-offset: 2px;
    }

    .shell {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      background: rgba(255, 253, 248, .82);
      box-shadow: 0 0 80px rgba(23, 63, 53, .08);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: max(28px, env(safe-area-inset-top)) 22px 72px;
      color: #fffdf6;
      background: var(--forest);
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      right: -94px;
      top: -104px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 50%;
      box-shadow: 0 0 0 34px rgba(255,255,255,.035), 0 0 0 68px rgba(255,255,255,.025);
      z-index: -1;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 38px;
      background: var(--paper);
      clip-path: polygon(0 44%, 12% 62%, 25% 33%, 39% 68%, 55% 37%, 69% 63%, 83% 31%, 100% 54%, 100% 100%, 0 100%);
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #efb27e;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: clamp(36px, 10vw, 54px);
      line-height: 1;
      letter-spacing: .07em;
    }

    .bird-mark {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      color: var(--forest);
      background: #efb057;
      border: 2px solid rgba(255,255,255,.55);
      border-radius: 50% 50% 45% 55%;
      font-size: 30px;
      transform: rotate(5deg);
      box-shadow: 8px 8px 0 rgba(0,0,0,.12);
    }

    .hero-copy {
      max-width: 420px;
      margin: 16px 0 0;
      color: rgba(255,255,255,.75);
      font-size: 13px;
      line-height: 1.7;
    }

    .total-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 22px;
      padding: 10px 14px;
      color: var(--forest);
      background: #fff6e5;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      box-shadow: 0 9px 22px rgba(0,0,0,.16);
    }

    .total-chip small { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .total-chip strong { font-size: 22px; font-variant-numeric: tabular-nums; }

    main { padding: 0 16px 130px; background: var(--paper); }
    .intro-card {
      position: relative;
      z-index: 2;
      margin: -34px 0 18px;
      padding: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .section-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: var(--orange-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .step-dot {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      color: #fff;
      background: var(--orange);
      border-radius: 50%;
      letter-spacing: 0;
    }

    label.field-label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .text-input, .select-input, .note-input {
      width: 100%;
      min-height: 48px;
      padding: 11px 12px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 11px;
      appearance: none;
    }

    .text-input::placeholder, .note-input::placeholder { color: #a6aaa4; }
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 13px;
      top: 50%;
      color: var(--forest);
      pointer-events: none;
      transform: translateY(-55%);
      font-weight: 800;
    }
    .select-wrap .select-input { padding-right: 34px; }

    .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .member-list { display: grid; gap: 14px; }
    .member-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 26px rgba(31, 50, 39, .08);
      animation: rise .38s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .member-head {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 13px;
      background: #f4f6f1;
      border-bottom: 1px solid var(--line);
    }

    .member-number {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: #fff;
      background: var(--forest);
      border-radius: 50%;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
    }

    .member-name {
      min-width: 0;
      padding: 9px 10px;
      background: transparent;
      border: 0;
      border-bottom: 1px dashed #9fa89d;
      border-radius: 0;
      font-weight: 700;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 50%;
    }
    .icon-btn:hover { color: var(--danger); background: #f7e9e6; }

    .member-body { padding: 13px; }
    .empty-items {
      margin: 4px 0 12px;
      padding: 18px 14px;
      color: var(--muted);
      background: #faf8f2;
      border: 1px dashed #cbc8bd;
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
    }

    .item-list { display: grid; gap: 11px; }
    .item-card {
      position: relative;
      padding: 14px;
      background: #fffdfa;
      border: 1px solid #e3dfd5;
      border-left: 4px solid var(--orange);
      border-radius: 12px;
    }

    .item-topline {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px 34px;
      gap: 8px;
      align-items: center;
      margin-top: 9px;
    }

    .qty {
      min-height: 44px;
      padding: 8px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .price-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }
    .price-line strong { color: var(--forest); font-size: 13px; }
    .note-input { min-height: 42px; margin-top: 9px; font-size: 13px; }

    .add-item, .add-member {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      padding: 11px 14px;
      color: var(--forest);
      background: #f3f7f2;
      border: 1px dashed #97a99f;
      border-radius: 12px;
      font-weight: 800;
    }
    .add-item:hover, .add-member:hover { background: #e9f1e9; }
    .add-member { margin: 16px 0 0; background: transparent; }

    .legend {
      margin: 18px 0 0;
      padding: 15px;
      color: #485148;
      background: #fff7e7;
      border: 1px solid #ead9b8;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.7;
    }
    .legend strong { color: var(--orange-dark); }

    .checkout {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 0;
      width: min(100%, 760px);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255, 253, 248, .94);
      border-top: 1px solid rgba(23, 63, 53, .14);
      backdrop-filter: blur(16px);
      transform: translateX(-50%);
    }

    .checkout-inner {
      display: grid;
      grid-template-columns: 1fr minmax(160px, 1.5fr);
      gap: 10px;
      align-items: center;
    }

    .checkout-total small { display: block; color: var(--muted); font-size: 10px; }
    .checkout-total strong { color: var(--forest); font-size: 22px; font-variant-numeric: tabular-nums; }
    .copy-btn {
      min-height: 52px;
      padding: 12px 16px;
      color: #fff;
      background: var(--forest);
      border: 0;
      border-radius: 13px;
      box-shadow: 0 8px 20px rgba(23, 63, 53, .24);
      font-weight: 800;
    }
    .copy-btn:hover { background: var(--forest-2); }
    .copy-btn:disabled { cursor: not-allowed; opacity: .45; box-shadow: none; }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 92px;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 11px 16px;
      color: #fff;
      background: #202722;
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-size: 13px;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 680px) {
      main { padding-inline: 28px; }
      .hero { padding-inline: 34px; }
      .intro-card { padding: 22px; }
      .member-head { padding: 15px 18px; }
      .member-body { padding: 18px; }
      .item-card { padding: 16px; }
      .item-grid {
        display: grid;
        grid-template-columns: minmax(150px, .8fr) minmax(220px, 1.5fr);
        gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">HAPPY BIRD · GROUP ORDER</p>
          <h1>快樂鳥</h1>
          <p class="hero-copy">一張讓大家輕鬆接力的聚餐點單。選好餐點後，一鍵複製到 LINE。</p>
        </div>
        <div class="bird-mark" aria-hidden="true">🐦</div>
      </div>
      <div class="total-chip" aria-live="polite">
        <small>目前預估</small>
        <strong id="heroTotal">$0</strong>
      </div>
    </header>

    <main>
      <section class="intro-card" aria-labelledby="order-title">
        <p class="section-kicker"><span class="step-dot">1</span> ORDER NAME</p>
        <label class="field-label" id="order-title" for="orderName">這次聚餐怎麼稱呼？</label>
        <input class="text-input" id="orderName" type="text" autocomplete="off" placeholder="例如：週五藥局聚餐">
        <p class="hint">菜單價格依照片建檔；結帳預估含 10% 服務費，實際金額以餐廳現場為準。</p>
      </section>

      <h2 class="section-kicker"><span class="step-dot">2</span> WHO'S EATING</h2>
      <section id="memberList" class="member-list" aria-label="點餐成員"></section>

      <button class="add-member" id="addMemberButton" type="button">
        <span aria-hidden="true">＋</span> 新增下一位
      </button>

      <aside class="legend">
        <strong>氣泡飲料半價：</strong>經典義大利麵、快樂經典套餐與披薩，每份可搭一杯氣泡飲料半價。系統會自動折抵符合數量的氣泡飲料。
      </aside>
    </main>

    <footer class="checkout">
      <div class="checkout-inner">
        <div class="checkout-total">
          <small id="discountSummary">含 10% 服務費</small>
          <strong id="footerTotal">$0</strong>
        </div>
        <button class="copy-btn" id="copyButton" type="button" disabled>複製訂單到 LINE</button>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="memberTemplate">
    <article class="member-card">
      <div class="member-head">
        <span class="member-number" aria-hidden="true"></span>
        <input class="member-name" type="text" autocomplete="off" aria-label="成員姓名" placeholder="輸入點餐人姓名">
        <button class="icon-btn remove-member" type="button" aria-label="移除此成員">✕</button>
      </div>
      <div class="member-body">
        <div class="item-list"></div>
        <div class="empty-items">還沒有餐點，從菜單挑一份吧。</div>
        <button class="add-item" type="button"><span aria-hidden="true">＋</span> 增加餐點／飲品</button>
      </div>
    </article>
  </template>

  <template id="itemTemplate">
    <div class="item-card">
      <div class="item-grid">
        <div class="select-wrap">
          <select class="select-input category-select" aria-label="餐點分類"></select>
        </div>
        <div class="select-wrap">
          <select class="select-input dish-select" aria-label="餐點品項"></select>
        </div>
      </div>
      <div class="item-topline">
        <input class="note-input" type="text" autocomplete="off" aria-label="餐點備註" placeholder="備註：去冰、不加蔥…">
        <input class="qty" type="number" inputmode="numeric" min="1" max="20" value="1" aria-label="數量">
        <button class="icon-btn remove-item" type="button" aria-label="移除此餐點">✕</button>
      </div>
      <div class="price-line">
        <span class="promo-label"></span>
        <strong class="line-price">$0</strong>
      </div>
    </div>
  </template>

          ["海風", 250],
          ["紫光 Gin Tonic", 250],
          ["椰子瑪格麗特", 250],
          ["椰果摩西多", 250],
          ["夏威夷可可", 250],
          ["伏特加小金吉", 250]
        ]
      },
      beer: {
        label: "好朋友的精釀啤酒",
        items: [
          ["Mint｜清新、口感輕盈", 180],
          ["Kooie｜香濃麥芽、餅乾風味", 180],
          ["青茶｜茶香清雅、細緻回甘", 180]
        ]
      }
    };

    const currency = new Intl.NumberFormat("zh-TW", {
      style: "currency",
      currency: "TWD",
      maximumFractionDigits: 0
    });

    const memberList = document.querySelector("#memberList");
    const orderName = document.querySelector("#orderName");
    const copyButton = document.querySelector("#copyButton");
    const heroTotal = document.querySelector("#heroTotal");
    const footerTotal = document.querySelector("#footerTotal");
    const discountSummary = document.querySelector("#discountSummary");
    const toast = document.querySelector("#toast");

    function categoryOptions() {
      return Object.entries(menuData)
        .map(([key, category]) => `<option value="${key}">${category.label}</option>`)
        .join("");
    }

    function dishOptions(categoryKey) {
      return menuData[categoryKey].items
        .map(([name, price], index) => `<option value="${index}">${name}｜${currency.format(price)}</option>`)
        .join("");
    }

    function addMember() {
      const fragment = document.querySelector("#memberTemplate").content.cloneNode(true);
      const card = fragment.querySelector(".member-card");
      const nameInput = fragment.querySelector(".member-name");

      fragment.querySelector(".remove-member").addEventListener("click", () => {
        if (memberList.children.length === 1) {
          showToast("至少保留一位點餐人");
          return;
        }
        card.remove();
        renumberMembers();
        updateSummary();
      });

      fragment.querySelector(".add-item").addEventListener("click", () => {
        addItem(card);
      });

      nameInput.addEventListener("input", updateSummary);
      memberList.appendChild(fragment);
      renumberMembers();
      nameInput.focus();
    }

    function addItem(memberCard) {
      const fragment = document.querySelector("#itemTemplate").content.cloneNode(true);
      const itemCard = fragment.querySelector(".item-card");
      const categorySelect = fragment.querySelector(".category-select");
      const dishSelect = fragment.querySelector(".dish-select");
      const quantity = fragment.querySelector(".qty");
      const note = fragment.querySelector(".note-input");

      categorySelect.innerHTML = categoryOptions();
      categorySelect.value = "pasta";

      const syncDishes = () => {
        dishSelect.innerHTML = dishOptions(categorySelect.value);
        updateLine(itemCard);
        updateSummary();
      };

      categorySelect.addEventListener("change", syncDishes);
      dishSelect.addEventListener("change", () => {
        updateLine(itemCard);
        updateSummary();
      });
      quantity.addEventListener("input", () => {
        quantity.value = Math.max(1, Math.min(20, Number(quantity.value) || 1));
        updateLine(itemCard);
        updateSummary();
      });
      note.addEventListener("input", updateSummary);
      fragment.querySelector(".remove-item").addEventListener("click", () => {
        itemCard.remove();
        syncEmptyState(memberCard);
        updateSummary();
      });

      memberCard.querySelector(".item-list").appendChild(fragment);
      syncDishes();
      syncEmptyState(memberCard);
      categorySelect.focus();
    }

    function syncEmptyState(memberCard) {
      const hasItems = memberCard.querySelectorAll(".item-card").length > 0;
      memberCard.querySelector(".empty-items").hidden = hasItems;
    }

    function updateLine(itemCard) {
      const categoryKey = itemCard.querySelector(".category-select").value;
      const dishIndex = Number(itemCard.querySelector(".dish-select").value);
      const quantity = Number(itemCard.querySelector(".qty").value) || 1;
      const category = menuData[categoryKey];
      const price = category.items[dishIndex]?.[1] || 0;
      const noteInput = itemCard.querySelector(".note-input");
      itemCard.querySelector(".line-price").textContent = currency.format(price * quantity);
      itemCard.querySelector(".promo-label").textContent = category.promo
        ? "可搭氣泡飲料半價"
        : category.softDrink
          ? "符合條件時自動半價"
          : "";
      noteInput.placeholder = categoryKey === "combo"
        ? "請選：紫米飯或脆薯；其他備註…"
        : "備註：去冰、不加蔥…";
    }

    function getOrderLines() {
      return [...document.querySelectorAll(".item-card")].map(card => {
        const categoryKey = card.querySelector(".category-select").value;
        const dishIndex = Number(card.querySelector(".dish-select").value);
        const category = menuData[categoryKey];
        const [name, price] = category.items[dishIndex];
        return {
          card,
          categoryKey,
          categoryLabel: category.label,
          name,
          price,
          quantity: Number(card.querySelector(".qty").value) || 1,
          note: card.querySelector(".note-input").value.trim(),
          promo: Boolean(category.promo),
          softDrink: Boolean(category.softDrink)
        };
      });
    }

    function calculateTotals() {
      const lines = getOrderLines();
      const subtotal = lines.reduce((sum, line) => sum + line.price * line.quantity, 0);
      const promoSlots = lines
        .filter(line => line.promo)
        .reduce((sum, line) => sum + line.quantity, 0);
      const softDrinks = lines
        .filter(line => line.softDrink)
        .flatMap(line => Array.from({ length: line.quantity }, () => line.price))
        .sort((a, b) => b - a);
      const discountedDrinks = softDrinks.slice(0, promoSlots);
      const discount = discountedDrinks.reduce((sum, price) => sum + price / 2, 0);
      const afterDiscount = subtotal - discount;
      const service = Math.round(afterDiscount * .1);
      return {
        subtotal,
        discount,
        discountedCount: discountedDrinks.length,
        service,
        total: afterDiscount + service
      };
    }

    function updateSummary() {
      const totals = calculateTotals();
      heroTotal.textContent = currency.format(totals.total);
      footerTotal.textContent = currency.format(totals.total);
      discountSummary.textContent = totals.discountedCount
        ? `已折 ${totals.discountedCount} 杯 · 含 10% 服務費`
        : "含 10% 服務費";

      const hasOrderName = orderName.value.trim().length > 0;
      const hasNamedMemberWithItem = [...document.querySelectorAll(".member-card")].some(card =>
        card.querySelector(".member-name").value.trim() &&
        card.querySelector(".item-card")
      );
      copyButton.disabled = !(hasOrderName && hasNamedMemberWithItem);
    }

    function renumberMembers() {
      [...document.querySelectorAll(".member-card")].forEach((card, index) => {
        card.querySelector(".member-number").textContent = index + 1;
        card.querySelector(".member-name").setAttribute("aria-label", `第 ${index + 1} 位成員姓名`);
      });
    }

    function generateOrderText() {
      const title = orderName.value.trim();
      const totals = calculateTotals();
      let text = `🐦【快樂鳥點餐｜${title}】\n`;

      [...document.querySelectorAll(".member-card")].forEach(card => {
        const name = card.querySelector(".member-name").value.trim();
        const itemCards = [...card.querySelectorAll(".item-card")];
        if (!name || !itemCards.length) return;

        text += `\n👤 ${name}\n`;
        itemCards.forEach(itemCard => {
          const categoryKey = itemCard.querySelector(".category-select").value;
          const dishIndex = Number(itemCard.querySelector(".dish-select").value);
          const [dishName, price] = menuData[categoryKey].items[dishIndex];
          const quantity = Number(itemCard.querySelector(".qty").value) || 1;
          const note = itemCard.querySelector(".note-input").value.trim();
          text += `・${dishName}${quantity > 1 ? ` × ${quantity}` : ""}｜${currency.format(price * quantity)}\n`;
          if (note) text += `  備註：${note}\n`;
        });
      });

      text += `\n────────────\n`;
      text += `餐點小計 ${currency.format(totals.subtotal)}\n`;
      if (totals.discount) text += `氣泡飲料半價 -${currency.format(totals.discount)}\n`;
      text += `服務費 10% ${currency.format(totals.service)}\n`;
      text += `預估總計 ${currency.format(totals.total)}\n`;
      text += `（實際金額以餐廳現場為準）`;
      return text;
    }

    async function copyOrder() {
      if (copyButton.disabled) return;
      const text = generateOrderText();
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
      showToast("訂單已複製，可以貼到 LINE 囉");
      copyButton.textContent = "已複製 ✓";
      window.setTimeout(() => { copyButton.textContent = "複製訂單到 LINE"; }, 1800);
    }

    let toastTimer;
    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.querySelector("#addMemberButton").addEventListener("click", addMember);
    orderName.addEventListener("input", updateSummary);
    copyButton.addEventListener("click", copyOrder);

    addMember();
    updateSummary();
  </script>
</body>
</html>
